<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Controle de Mercadorias em Falta">
    <title>Controle de Faltas</title>
  </head>
  <body>
    <script>
      // Tema
      (function() {
        try {
          var theme = localStorage.getItem('@MercadoriaData:theme');
          if (theme === 'light') {
            document.body.classList.add('light-mode');
          }
        } catch (e) {}
      })();

      // Unregister ALL Service Workers and clear caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        }
      }

      // Safety net: if React doesn't render in 4 seconds, show recovery UI
      window.__appRendered = false;
      setTimeout(function() {
        if (!window.__appRendered && document.getElementById('root')) {
          var root = document.getElementById('root');
          if (!root.hasChildNodes() || root.innerHTML.trim() === '') {
            root.innerHTML = '<div style="min-height:100vh;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:sans-serif">' +
              '<div style="background:rgba(30,41,59,0.95);border:1px solid rgba(59,130,246,0.4);padding:2.5rem;border-radius:12px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5)">' +
              '<h2 style="color:#60a5fa;margin-bottom:1rem;font-size:1.4rem">Atualização do Sistema</h2>' +
              '<p style="color:#94a3b8;font-size:0.9rem;margin-bottom:1.5rem;line-height:1.5">Detectamos cache antigo no navegador. Clique abaixo para limpar e acessar.</p>' +
              '<button onclick="try{localStorage.clear();sessionStorage.clear()}catch(e){}window.location.href=\'/login\'" style="background:#2563eb;color:#fff;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;font-size:0.95rem;cursor:pointer">Limpar Cache e Acessar</button>' +
              '</div></div>';
          }
        }
      }, 4000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
